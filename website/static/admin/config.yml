backend:
  name: github
  repo: zj75968-cpu/docusaurus
  branch: main
  base_url: https://kb.n8nmydomain.com
  auth_endpoint: api/auth
  auth_scope: public_repo
  use_graphql: true
  commit_messages:
    create: 'content({{collection}}): create {{slug}} (AI-assisted)'
    update: 'content({{collection}}): update {{slug}} (AI-assisted)'
    delete: 'content({{collection}}): delete {{slug}} (AI-assisted)'
    uploadMedia: 'content(media): upload {{path}} (AI-assisted)'
    deleteMedia: 'content(media): delete {{path}} (AI-assisted)'

site_url: https://kb.n8nmydomain.com
display_url: https://kb.n8nmydomain.com
logo:
  src: /img/brand/logo.svg
  show_in_header: true
locale: zh_Hans
publish_mode: simple
media_folder: website/static/img/uploads
public_folder: /img/uploads
show_preview_links: false
editor:
  preview: false
slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: knowledge_base_zh_cn
    label: 中文源文章
    label_singular: 中文源文章
    description: 默认发布到中文根站点。英文翻译必须使用相同分类、路径和文档 ID。
    folder: website/docs/knowledge-base
    create: true
    delete: true
    extension: md
    format: frontmatter
    path: '{{category}}/{{fields.slug}}'
    summary: '[中文] {{title}} — {{category}}/{{fields.slug}}'
    preview_path: 'docs/knowledge-base/{{category}}/{{fields.slug}}'
    sortable_fields: [title, sidebar_position, commit_date]
    view_groups:
      - label: 分类
        field: category
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 路径
        name: slug
        widget: string
        hint: URL 与文件名片段，例如 `getting-started`，不要包含 `/`。
        pattern:
          [
            '^[a-z0-9]+(?:[a-z0-9-]*[a-z0-9])?$',
            '只能使用小写字母、数字和中间连字符。',
          ]
      - label: 分类
        name: category
        widget: select
        options:
          - {label: 开始, value: general}
          - {label: 指南, value: guides}
          - {label: 参考, value: reference}
        default: general
      - label: 侧边栏顺序
        name: sidebar_position
        widget: number
        value_type: int
        min: 1
        default: 100
      - label: 侧边栏标题
        name: sidebar_label
        widget: string
        required: false
      - label: 摘要
        name: description
        widget: text
      - label: 标签
        name: tags
        widget: list
        required: false
        allow_add: true
        field: {label: 标签, name: tag, widget: string}
      - label: 封面图片
        name: image
        widget: image
        required: false
      - label: 正文
        name: body
        widget: markdown
        hint: 支持标准 Markdown 与 `[[WikiLink]]`，保存后由站点构建处理。

  - name: knowledge_base_en
    label: English translations
    label_singular: English translation
    description: Translate an existing Chinese source article and keep the same category, path, and document ID.
    folder: website/i18n/en/docusaurus-plugin-content-docs/current/knowledge-base
    create: true
    delete: true
    extension: md
    format: frontmatter
    path: '{{category}}/{{fields.slug}}'
    summary: '[EN] {{title}} — {{category}}/{{fields.slug}}'
    preview_path: 'en/docs/knowledge-base/{{category}}/{{fields.slug}}'
    sortable_fields: [title, sidebar_position, commit_date]
    view_groups:
      - label: Category
        field: category
    fields:
      - label: Title
        name: title
        widget: string
      - label: Path
        name: slug
        widget: string
        hint: Must match the Chinese source path, for example `getting-started`. Do not include `/`.
        pattern:
          [
            '^[a-z0-9]+(?:[a-z0-9-]*[a-z0-9])?$',
            'Use lowercase letters, numbers, and internal hyphens only.',
          ]
      - label: Category
        name: category
        widget: select
        hint: Must match the Chinese source category.
        options:
          - {label: Start here, value: general}
          - {label: Guides, value: guides}
          - {label: Reference, value: reference}
        default: general
      - label: Sidebar order
        name: sidebar_position
        widget: number
        value_type: int
        min: 1
        default: 100
      - label: Sidebar label
        name: sidebar_label
        widget: string
        required: false
      - label: Description
        name: description
        widget: text
      - label: Tags
        name: tags
        widget: list
        required: false
        allow_add: true
        field: {label: Tag, name: tag, widget: string}
      - label: Cover image
        name: image
        widget: image
        required: false
      - label: Body
        name: body
        widget: markdown
        hint: Standard Markdown and `[[WikiLink]]` syntax are supported by the site build.
